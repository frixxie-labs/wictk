[package]
name = "notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.52.3", features = ["full"] }
wictk_core = {path = "../wictk_core"}
