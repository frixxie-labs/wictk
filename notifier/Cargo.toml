[package]
name = "notifier"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tokio = { version = "1.54.0", features = ["full"] }
wictk_core = {path = "../wictk_core"}

[dev-dependencies]
chrono = "0.4.45"
mockito = "1.7.2"
quickcheck = "1"
